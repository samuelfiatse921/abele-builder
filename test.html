<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaflet Map Example</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /*body {*/
        /*    margin: 0;*/
        /*    padding: 0;*/
        /*}*/
        /*#map {*/
        /*    width: 100%;*/
        /*    height: 400px; !* ensure fixed height *!*/
        /*}*/
    </style>
</head>
<body>
<i class="fa fa-ellipsis-v" onclick="editPageName(this)" aria-hidden="true"></i>

<h2>Leaflet Map with invalidateSize Fix</h2>
<div id="map" style="width: 100%; height: 400px" ></div>
<div id="gjs"></div>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // Initialize map
    const map = L.map('map').setView([5.6037, -0.1870], 12); // Accra

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ✅ Fix: redraw after small delay so tiles load properly
    setTimeout(() => {
        map.invalidateSize();
    }, 200);
</script>
</body>
</html>
